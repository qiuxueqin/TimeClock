# 测试配置（S0-DB-01）。仅用于测试，连接到独立的 time_clock_test 测试库。
# 连接信息仍从环境变量注入；测试库与开发/生产库分离，运行测试前可重建。
spring:
  datasource:
    url: jdbc:mysql://${TC_MYSQL_HOST:localhost}:${TC_MYSQL_PORT:3306}/${TC_MYSQL_TEST_DATABASE:time_clock_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TC_MYSQL_USERNAME:root}
    password: ${TC_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
