# =====================================================================
# 学习打卡系统后端配置
# 敏感连接信息一律从环境变量注入；本文件不含任何凭据/秘密。
# =====================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: timeclock-backend

  # ---- 主数据源（开发/生产）----
  # 通过环境变量注入，例如：
  #   TC_MYSQL_HOST / TC_MYSQL_PORT / TC_MYSQL_DATABASE / TC_MYSQL_USERNAME / TC_MYSQL_PASSWORD
  datasource:
    url: jdbc:mysql://${TC_MYSQL_HOST:localhost}:${TC_MYSQL_PORT:3306}/${TC_MYSQL_DATABASE:time_clock}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TC_MYSQL_USERNAME:root}
    password: ${TC_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
